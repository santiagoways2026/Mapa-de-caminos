<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mapa del Camino · Santiago Ways</title>
  <link rel="icon" href="assets/isotipo-shell.png">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Sistema de diseño Santiago Ways: tokens + tipografía -->
  <link rel="stylesheet" href="_ds/santiago-ways-design-system-4e2441b7-6b99-48ec-92d1-4600dc6fda45/colors_and_type.css">
  <!-- Chrome responsive -->
  <link rel="stylesheet" href="styles-responsive.css">
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <img src="assets/logo-white.png" alt="Santiago Ways">
      <div class="splash-bar"><span></span></div>
    </div>
  </div>
  <div id="root"></div>

  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; background: #184834; display: flex; align-items: center; justify-content: center; transition: opacity .42s cubic-bezier(0.22,0.61,0.36,1); }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 36px; width: min(86%, 520px); }
    #splash img { width: 360px; max-width: 86%; height: auto; display: block; }
    #splash .splash-bar { width: 100%; height: 4px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
    #splash .splash-bar span { display: block; height: 100%; width: 100%; border-radius: 99px; background: #fff; transform-origin: left; transform: scaleX(0); animation: cwload 1.05s cubic-bezier(0.22,0.61,0.36,1) forwards; }
    @keyframes cwload { to { transform: scaleX(1); } }
  </style>
  <script>
    (function () {
      var start = Date.now();
      window.__hideSplash = function () {
        var wait = Math.max(0, 1150 - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById("splash");
          if (!s) return;
          s.classList.add("done");
          setTimeout(function () { if (s) s.style.display = "none"; }, 460);
        }, wait);
      };
      // red de seguridad: ocultar pase lo que pase
      setTimeout(function () { window.__hideSplash(); }, 6000);
    })();
  </script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- React (app usa React.createElement, no necesita Babel) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <!-- Bundle del sistema de diseño Santiago Ways -->
  <script src="_ds/santiago-ways-design-system-4e2441b7-6b99-48ec-92d1-4600dc6fda45/_ds_bundle.js"></script>

  <!-- Datos + app responsive -->
  <script src="data/caminos.js"></script>
  <script src="app-responsive.js"></script>
</body>
</html>
